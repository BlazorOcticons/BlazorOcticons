name: .NET

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET SDKs
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build -c Release --no-restore

    - name: Test
      run: dotnet test --no-build --verbosity normal

    - name: Build solution and generate NuGet package
      run: dotnet pack -c Release -o out

    - name: NuGet login (Trusted Publishing)
      if: github.event_name == 'push'
      uses: NuGet/login@v1
      id: login
      with:
        user: elv1s42

    - name: Publish Nuget to NuGet.org
      if: github.event_name == 'push'
      run: dotnet nuget push ./out/BlazorOcticons*.nupkg -k ${{ steps.login.outputs.NUGET_API_KEY }} -s https://api.nuget.org/v3/index.json --skip-duplicate --no-symbols
